name: Cypress E2E Tests

on:
  push:
    branches: [ develop ] # 我根据你的截图将分支改为了 develop，如果不对请改回 main

jobs:
  cypress-run:
    runs-on: ubuntu-latest
    steps:
      # 第1步：检出代码
      - name: Checkout repository
        uses: actions/checkout@v4

      # 第2步：安装 Node.js v20 环境，这步我们做对了
      - name: Use Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 第3步：安装 Yarn
      - name: Install Yarn
        run: npm install -g yarn

      # 第4步：安装项目依赖
      - name: Install dependencies
        run: yarn install

      # 第5步：运行 Cypress 测试【这是关键的修改！】
      # 我们直接调用 cypress run 命令，并加上 --spec 参数，
      # 明确告诉它只运行端到端测试，避开所有单元测试和其他脚本。
      - name: Run Cypress E2E tests
        run: yarn cypress run --spec "cypress/e2e/**/*.spec.ts"